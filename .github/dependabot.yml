version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

    groups:
      prisma:
        patterns:
          - prisma
          - "@prisma/*"

      vite-toolchain:
        patterns:
          - vite
          - "@vitejs/*"
          - vitest
          - "@vitest/*"
          - rollup
          - esbuild

      eslint-toolchain:
        patterns:
          - eslint
          - eslint-*
          - "@eslint/*"
          - typescript-eslint
          - "@typescript-eslint/*"

      # Keep react / react-dom / types on one PR so npm ci can resolve peers.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"

    ignore:
      # Keep ESLint majors manual/lockstep with the rest of the toolchain.
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: "@eslint/js"
        update-types:
          - version-update:semver-major
      # v7 pulls zod 4 via the React Compiler ruleset; stay on v5 until the
      # app is ready to upgrade zod.
      - dependency-name: eslint-plugin-react-hooks
        update-types:
          - version-update:semver-major
